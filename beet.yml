# changelog
# fixed paint buckets
# fixed particle warning in log
# added setting for eyedropper keybind

name: MC Paint
version: v1.10.0-beta1
output: build

data_pack:
  description: "Create custom paintings!\nBy Eroxen."
  min_format: [121, 0]
  max_format: 121
  zipped: true
  load:
    - src

resource_pack:
  zipped: true
  description: "Create custom paintings!\nBy Eroxen."
  min_format: [97, 1]
  max_format: 97
  load:
    - src

require:
  - bolt
  - eroxified2

pipeline:
  - mecha
  - beet.contrib.load

meta:
  load:
    data_pack:
      data: libs/*/data