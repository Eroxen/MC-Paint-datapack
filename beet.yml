name: MC Paint
version: v1.7.0
output: build

data_pack:
  description: "Create custom paintings!\nBy Eroxen."
  min_format: [94, 1]
  max_format: 94
  zipped: true
  load:
    - src

resource_pack:
  zipped: true
  description: "Create custom paintings!\nBy Eroxen."
  min_format: [75, 0]
  max_format: 75
  load:
    - src

require:
  - bolt
  - eroxified2

pipeline:
  - mecha
  - beet.contrib.load

meta:
  load:
    data_pack:
      data: libs/*/data